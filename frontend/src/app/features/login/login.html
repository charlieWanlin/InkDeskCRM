<div class="grid min-h-screen w-full grid-cols-1 bg-surface md:grid-cols-2">
  <!-- Panneau gauche : marque (sombre) -->
  <div
    class="relative hidden flex-col justify-between overflow-hidden bg-ink p-12 text-white md:flex"
  >
    <div
      class="pointer-events-none absolute right-0 top-1/2 h-[38rem] w-[38rem] -translate-y-1/2 translate-x-1/3 rounded-full bg-primary/25 blur-[120px]"
    ></div>
    <div
      class="pointer-events-none absolute -bottom-24 -left-16 h-72 w-72 rounded-full bg-primary/10 blur-3xl"
    ></div>

    <div class="relative">
      <img src="assets/img/moon.png" alt="" class="mb-5 h-14 w-14 select-none" />
      <p class="text-xl font-bold tracking-wide text-white">{{ shopName }}</p>
      <p class="mt-0.5 text-sm text-white/45">{{ softwareName }}</p>
    </div>

    <h2 class="relative max-w-md text-4xl font-bold leading-[1.15] text-white">
      Gérez votre studio,<br />concentrez-vous sur l’encre.
    </h2>

    <p class="relative text-sm text-white/40">
      Clients, rendez-vous, devis et factures au même endroit.
    </p>
  </div>

  <!-- Panneau droit : formulaire de connexion -->
  <div class="flex min-h-screen flex-col justify-center bg-surface px-6 py-10 sm:px-16">
    <div class="mx-auto w-full max-w-md">
      <p class="text-sm font-bold uppercase tracking-[0.12em] text-fg">{{ shopName }}</p>

      <h1 class="mt-10 text-3xl font-bold text-fg">Connexion</h1>
      <p class="mt-1.5 text-[15px] text-fg-muted">Accédez à votre espace de gestion.</p>

      <form (ngSubmit)="seConnecter()" [formGroup]="form" class="mt-8 flex flex-col gap-5">
        <label class="block">
          <span class="mb-1.5 block text-sm font-semibold text-fg">Adresse e-mail</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="vous@studio.fr"
            class="h-12 w-full rounded-xl border border-border bg-surface px-4 text-[15px] text-fg outline-none transition placeholder:text-fg-subtle focus:border-primary focus:ring-4 focus:ring-primary/15"
          />
        </label>

        <label class="block">
          <span class="mb-1.5 block text-sm font-semibold text-fg">Mot de passe</span>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••••"
            class="h-12 w-full rounded-xl border border-border bg-surface px-4 text-[15px] text-fg outline-none transition placeholder:text-fg-subtle focus:border-primary focus:ring-4 focus:ring-primary/15"
          />
        </label>

        @if (erreur()) {
          <p class="rounded-xl bg-danger-soft px-4 py-2.5 text-sm font-medium text-danger">
            {{ erreur() }}
          </p>
        }

        <button
          type="submit"
          [disabled]="chargement()"
          class="mt-1 flex h-12 items-center justify-center gap-2 rounded-xl bg-primary text-[15px] font-semibold text-white shadow-sm transition hover:bg-primary-hover disabled:opacity-60"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
            <path d="M10 17l5-5-5-5M15 12H3" />
          </svg>
          {{ chargement() ? 'Connexion…' : 'Se connecter' }}
        </button>
      </form>

      <p class="mt-10 text-center text-sm text-fg-subtle">
        Accès réservé — données protégées et chiffrées.
      </p>
    </div>
  </div>
</div>
