<div class="min-h-full bg-canvas p-4 sm:p-6">
  <app-page-header title="Mon profil">
    <app-button variant="primary" (click)="enregistrer()">
      <app-icon name="check" [size]="16" /> Enregistrer
    </app-button>
  </app-page-header>

  <form
    [formGroup]="form"
    (ngSubmit)="enregistrer()"
    class="grid max-w-6xl grid-cols-1 gap-4 xl:grid-cols-[360px_1fr]"
  >

    <section class="rounded-2xl border border-border bg-surface p-5">
      <div class="flex flex-col items-center text-center">
        <app-avatar size="lg" [initials]="initiales()" />
        <h2 class="mt-4 text-xl font-bold text-fg">{{ nom() }}</h2>
        <p class="mt-1 text-sm text-fg-muted">{{ role() }}</p>
        <span
          class="mt-3 rounded-full bg-primary-soft px-3 py-1 text-xs font-semibold text-primary"
        >
          {{ studio() }}
        </span>
      </div>

      <button
        type="button"
        (click)="seDeconnecter()"
        class="mt-5 flex w-full items-center justify-center gap-2 rounded-lg border border-border bg-surface px-4 py-2.5 text-sm font-semibold text-fg transition hover:bg-surface-2"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
        </svg>
        Se déconnecter
      </button>
    </section>

    <section class="rounded-2xl border border-border bg-surface p-5">
      <div class="mb-5">
        <h2 class="text-lg font-semibold text-fg">Informations personnelles</h2>
        <p class="mt-1 text-sm text-fg-muted">Mettez à jour vos coordonnées.</p>
      </div>

      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div class="flex flex-col gap-1.5">
          <label for="profil-nom" class="text-sm font-semibold text-fg">Nom</label>
          <input
            id="profil-nom"
            formControlName="nom"
            class="h-10 rounded-lg border border-border bg-surface px-3 text-sm text-fg outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
          />
          @if (error('nom'); as m) {
            <span class="text-xs text-danger">{{ m }}</span>
          }
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="profil-email" class="text-sm font-semibold text-fg">Email</label>
          <input
            id="profil-email"
            type="email"
            formControlName="email"
            class="h-10 rounded-lg border border-border bg-surface px-3 text-sm text-fg outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
          />
          @if (error('email'); as m) {
            <span class="text-xs text-danger">{{ m }}</span>
          }
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="profil-telephone" class="text-sm font-semibold text-fg">Téléphone</label>
          <input
            id="profil-telephone"
            type="tel"
            formControlName="telephone"
            class="h-10 rounded-lg border border-border bg-surface px-3 text-sm text-fg outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
          />
        </div>
        <div class="flex flex-col gap-1.5">
          <label for="profil-role" class="text-sm font-semibold text-fg">Rôle</label>
          <input
            id="profil-role"
            [value]="role()"
            disabled
            class="h-10 cursor-not-allowed rounded-lg border border-border bg-surface-2 px-3 text-sm text-fg-muted outline-none"
          />
        </div>
        <div class="flex flex-col gap-1.5 md:col-span-2">
          <label for="profil-bio" class="text-sm font-semibold text-fg">Bio</label>
          <textarea
            id="profil-bio"
            rows="4"
            formControlName="bio"
            class="rounded-lg border border-border bg-surface px-3 py-2 text-sm text-fg outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
          ></textarea>
        </div>
      </div>
    </section>
  </form>
</div>
