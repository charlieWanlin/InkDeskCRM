<div class="flex h-screen bg-canvas text-fg">

  <a
    href="#contenu"
    class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-lg focus:bg-primary focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-white focus:shadow-lg"
  >
    Aller au contenu
  </a>

  @if (mobileOpen()) {
    <button
      type="button"
      aria-label="Fermer le menu"
      class="fixed inset-0 z-40 bg-black/50 lg:hidden"
      (click)="closeMobile()"
    ></button>
  }

  <app-sidebar [collapsed]="collapsed()" [mobileOpen]="mobileOpen()" />

  <div class="flex flex-1 flex-col overflow-hidden">
    <app-topbar [mobileOpen]="mobileOpen()" (toggleSidebar)="onToggle()" />

    <app-breadcrumb />

    <main id="contenu" tabindex="-1" class="flex-1 overflow-y-auto outline-none">
      <router-outlet />
    </main>
  </div>
</div>
