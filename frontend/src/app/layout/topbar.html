<header
  class="sticky top-0 z-30 flex h-16 flex-shrink-0 items-center justify-between border-b border-border bg-surface px-4"
>

  <button
    (click)="toggleSidebar.emit()"
    aria-label="Réduire ou agrandir le menu"
    title="Menu"
    aria-controls="navigation-principale"
    [attr.aria-expanded]="mobileOpen()"
    class="grid h-9 w-9 place-items-center rounded-lg text-fg-muted transition hover:bg-surface-2 hover:text-fg"
  >
    <app-icon name="menu" [size]="20" />
  </button>

  <div class="flex items-center gap-1.5">
    <app-theme-toggle />

    <div class="relative ml-1">
      <button
        (click)="$event.stopPropagation(); toggleMenu()"
        aria-label="Menu du profil"
        class="flex items-center gap-2 rounded-full py-1 pl-1 pr-2 transition hover:bg-surface-2"
      >
        <span
          class="grid h-9 w-9 flex-shrink-0 place-items-center rounded-full bg-primary text-xs font-semibold text-white"
          >{{ initiales() || 'EC' }}</span
        >
        <app-icon name="chevron-down" [size]="16" class="text-fg-subtle" />
      </button>

      @if (menuOpen()) {
        <div
          class="absolute right-0 top-12 z-40 w-56 overflow-hidden rounded-xl border border-border bg-surface text-fg shadow-lg"
        >
          <div class="border-b border-border px-4 py-3">
            <p class="truncate text-sm font-semibold text-fg">
              {{ user()?.name ?? 'Utilisateur' }}
            </p>
            <p class="truncate text-xs text-fg-muted capitalize">{{ user()?.role ?? '' }}</p>
          </div>

          <div class="p-1">
            <a
              routerLink="/parametres"
              (click)="closeMenu()"
              class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm text-fg transition hover:bg-surface-2"
            >
              <app-icon name="settings" [size]="16" /> Paramètres
            </a>
            <button
              (click)="logout()"
              class="flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-left text-sm text-danger transition hover:bg-danger-soft"
            >
              <app-icon name="log-out" [size]="16" /> Déconnexion
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</header>
