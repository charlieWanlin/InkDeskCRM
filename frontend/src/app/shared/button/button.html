<button [type]="type()" [disabled]="disabled() || loading()" [class]="classes()">
  @if (loading()) {
    <svg
      class="animate-spin"
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
    >
      <path d="M21 12a9 9 0 1 1-6.219-8.56" />
    </svg>
  }
  <ng-content />
</button>
